name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish in dry-run mode (no actual upload)'
        type: boolean
        default: false

permissions:
  contents: write   # needed to create the GitHub Release
  id-token: write   # needed for npm provenance via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing via OIDC requires npm CLI 11.5.1 or newer. The npm
      # shipped with Node 22.22.2 is both older than that AND has a packaging
      # regression that breaks `npm install -g npm@latest` (missing
      # promise-retry in arborist). Bypass the bundled npm entirely with
      # corepack, which is shipped with Node and is designed for exactly this.
      - name: Install pinned npm via corepack
        run: |
          corepack enable
          corepack prepare npm@11.5.1 --activate
          npm --version

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Auth via npm trusted publishing (OIDC). No NPM_TOKEN required —
      # this workflow's identity is validated against the trusted publisher
      # configured at https://www.npmjs.com/package/@astami/claude-code-bridge/access.
      # The id-token: write permission at the top of this file is what lets
      # GitHub mint the OIDC token npm will validate.
      - name: Publish to npm
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-from-tag \
            --verify-tag
